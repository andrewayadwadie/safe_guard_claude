plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.hilt.android)
    alias(libs.plugins.ksp)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.google.services)
    id 'kotlin-parcelize'
}

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Build configuration comes from an untracked secrets.properties.
// When it is absent, fall back to the committed example so a fresh clone
// builds debug with no setup step (FR-003).
def secretsFile = rootProject.file('secrets.properties')
def secretsExampleFile = rootProject.file('secrets.properties.example')
def secrets = new Properties()
if (secretsFile.exists()) {
    secretsFile.withInputStream { secrets.load(it) }
} else if (secretsExampleFile.exists()) {
    secretsExampleFile.withInputStream { secrets.load(it) }
}
def secret = { String key -> (secrets.getProperty(key) ?: '').trim() }

android {
    namespace 'com.safeguard.parentalcontrol'
    compileSdk 36

    // Release signing is only configured when usable credentials are present.
    // A missing file OR a blank storePassword leaves the config undefined, so debug
    // builds are never affected and only release tasks fail (FR-038).
    def hasReleaseSigning = keystorePropertiesFile.exists() &&
            (keystoreProperties['storePassword'] ?: '').trim() &&
            (keystoreProperties['keyAlias'] ?: '').trim() &&
            (keystoreProperties['keyPassword'] ?: '').trim() &&
            (keystoreProperties['storeFile'] ?: '').trim()

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.safeguard.parentalcontrol"
        minSdk 26
        targetSdk 36
        versionCode 12
        versionName "1.2.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        // Only ship ABIs a target device actually uses. TensorFlow Lite publishes four
        // ABIs; without this filter x86 and x86_64 (~13 MB of native payload) are packaged
        // for devices that do not exist in this app's market (FR-043).
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        // Backend configuration. API_BASE_URL is set per buildType below (FR-004).
        buildConfigField "String", "API_VERSION", "\"1.0\""
        buildConfigField "String", "API_HOST", "\"${secret('API_HOST')}\""

        // Certificate pinning. Empty values disable pinning entirely - NetworkModule
        // must never build a pin from an empty string (FR-009).
        buildConfigField "String", "CERT_PIN_PRIMARY", "\"${secret('CERT_PIN_PRIMARY')}\""
        buildConfigField "String", "CERT_PIN_BACKUP", "\"${secret('CERT_PIN_BACKUP')}\""

        // Google OAuth - Web Client ID (client_type 3) from google-services.json.
        // Must belong to the same Firebase project as google-services.json (814941014353 / haris-db7b0),
        // otherwise Google Sign-In fails with DEVELOPER_ERROR.
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"${secret('GOOGLE_WEB_CLIENT_ID')}\""
    }

    buildTypes {
        release {
            signingConfig hasReleaseSigning ? signingConfigs.release : null
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            buildConfigField "String", "API_BASE_URL", "\"${secret('API_BASE_URL_RELEASE')}\""
        }
        debug {
            minifyEnabled false

            buildConfigField "String", "API_BASE_URL", "\"${secret('API_BASE_URL_DEBUG')}\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            '-opt-in=kotlin.RequiresOptIn',
            '-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi',
            '-opt-in=androidx.compose.material3.ExperimentalMaterial3Api'
        ]
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    // Prevent TFLite models from being compressed
    aaptOptions {
        noCompress "tflite"
    }

    bundle {
        // Language splitting MUST stay disabled. The app ships Arabic and English; with
        // splitting on, a tester whose device locale differs from the install-time locale
        // can receive an APK missing their strings (FR-041).
        language { enableSplit = false }
        density { enableSplit = true }
        abi { enableSplit = true }
    }
}

// ---------------------------------------------------------------------------
// Release-only configuration guards.
// See specs/013-play-store-release-readiness/contracts/build-guards.md
//
// Hooked to preReleaseBuild so the build fails BEFORE compilation and before any
// artifact is emitted, and so debug builds can never be blocked (FR-007).
// Values are captured as plain Strings so the configuration cache stays valid -
// gradle.taskGraph.whenReady is unusable here because this project enables
// org.gradle.configuration-cache.
// ---------------------------------------------------------------------------
def guardReleaseUrl = secret('API_BASE_URL_RELEASE')
def guardClientId = secret('GOOGLE_WEB_CLIENT_ID')
def guardApiHost = secret('API_HOST')
def guardPinPrimary = secret('CERT_PIN_PRIMARY')
def guardPinBackup = secret('CERT_PIN_BACKUP')

tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    doFirst {
        def failures = []

        // G-1: release URL must be HTTPS
        if (!guardReleaseUrl.startsWith('https://')) {
            failures << "API_BASE_URL_RELEASE must start with 'https://' (found: '${guardReleaseUrl}')"
        }

        // G-2: placeholders must be replaced
        if (guardReleaseUrl.contains('REPLACE_ME')) {
            failures << "API_BASE_URL_RELEASE still contains the placeholder REPLACE_ME"
        }
        if (guardClientId.contains('REPLACE_ME')) {
            failures << "GOOGLE_WEB_CLIENT_ID still contains the placeholder REPLACE_ME"
        }

        // G-3: pin host must match request host. A pin registered against a host the
        // app never contacts is silently inert, which reads as protection but is not.
        if (!guardPinPrimary.isEmpty() || !guardPinBackup.isEmpty()) {
            String urlHost = null
            try {
                urlHost = new URI(guardReleaseUrl).host
            } catch (Exception ignored) {
                urlHost = null
            }
            if (urlHost == null || guardApiHost != urlHost) {
                failures << ("API_HOST ('${guardApiHost}') does not match the host of " +
                        "API_BASE_URL_RELEASE ('${urlHost}'). Pins registered against a host the " +
                        "app never contacts are silently inert. Correct API_HOST, or clear " +
                        "CERT_PIN_PRIMARY and CERT_PIN_BACKUP to disable pinning.")
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException(
                    "\n\nRelease build blocked - fix secrets.properties:\n" +
                    failures.collect { "  * ${it}" }.join("\n") +
                    "\n\nSee specs/013-play-store-release-readiness/contracts/build-guards.md\n")
        }
    }
}

// ---------------------------------------------------------------------------
// Banned-permission and foreground-service declaration guard.
// See specs/015-remove-datasync-fgs-permission/contracts/build-guard.md
//     specs/016-remove-all-files-access/contracts/build-guard.md
//
// Deleting a permission from the app manifest fixes the problem once; it does not keep it
// fixed. A dependency upgrade can contribute a <uses-permission> node or a
// foregroundServiceType attribute into the MERGED manifest with no change to any file a
// reviewer reads. This guard reads the merged manifest and blocks the build.
//
// Feature 016 extended this guard rather than adding a second one: the manifest-locating,
// comment-stripping and origin-reporting logic is identical, and two guards reading the same
// file at the same point in the same build would mean a future reader had to check both to
// know what is enforced.
//
// Hooked to the manifest-processing task rather than preReleaseBuild: at preReleaseBuild
// time the merged manifest does not exist yet, so there is nothing to inspect. Both
// bundleRelease and assembleRelease depend on processReleaseMainManifest, so the guard
// cannot be skipped while producing a release artifact. Debug is checked too, so the
// failure surfaces during ordinary development instead of at release time.
// ---------------------------------------------------------------------------
tasks.matching { it.name ==~ /process(Debug|Release)MainManifest/ }.configureEach {
    doLast { manifestTask ->
        def candidates = []
        manifestTask.outputs.files.files.each { f ->
            if (f.isDirectory()) {
                f.eachFileRecurse { if (it.name == 'AndroidManifest.xml') candidates << it }
            } else if (f.name == 'AndroidManifest.xml') {
                candidates << f
            }
        }

        // A guard that silently skips when its input is missing reports safety it never
        // checked, so an unresolvable manifest is a failure and not a pass.
        if (candidates.isEmpty()) {
            throw new GradleException(
                    "\n\nManifest guard could not locate the merged manifest " +
                    "produced by '${manifestTask.name}'.\n" +
                    "The guard must not pass without inspecting it.\n\n" +
                    "See specs/015-remove-datasync-fgs-permission/contracts/build-guard.md\n" +
                    "    specs/016-remove-all-files-access/contracts/build-guard.md\n")
        }

        // Permissions that must never appear in the shipped manifest, and why. The reason is
        // printed on failure so the next developer does not simply add the permission back.
        def bannedPermissions = [
                'android.permission.FOREGROUND_SERVICE_DATA_SYNC':
                        'A dataSync foreground service is capped at ~6 cumulative hours per 24 on\n' +
                        '  API 35+ and cannot be started from BOOT_COMPLETED. For a 24/7\n' +
                        '  child-protection monitor both failures are silent.\n' +
                        '  See specs/015-remove-datasync-fgs-permission/contracts/build-guard.md',

                'android.permission.MANAGE_EXTERNAL_STORAGE':
                        'Google Play restricts all-files access to file managers, backup/restore,\n' +
                        '  anti-virus, document management, on-device file search, disk encryption and\n' +
                        '  device migration. Parental control is NOT a permitted use, so declaring it\n' +
                        '  blocks the release review. Photos are read with READ_MEDIA_IMAGES; flagged\n' +
                        '  images are modified through parent-granted folder access (MediaWriteAccess).\n' +
                        '  See specs/016-remove-all-files-access/contracts/build-guard.md',

                'android.permission.QUERY_ALL_PACKAGES':
                        'Google Play treats the list of installed apps as personal and sensitive\n' +
                        '  data and restricts this permission to apps whose core purpose is broad app\n' +
                        '  visibility (device search, anti-virus, file managers). Parental control is\n' +
                        '  NOT a permitted use, so declaring it forces a sensitive-permission\n' +
                        '  declaration and blocks the release review. The app list, per-app limits and\n' +
                        '  app blocking run on the filtered <queries> block (ACTION_MAIN +\n' +
                        '  CATEGORY_LAUNCHER / CATEGORY_HOME) in app/src/main/AndroidManifest.xml.'
        ]

        def failures = []

        candidates.each { manifestFile ->
            def text = manifestFile.getText('UTF-8')

            // Strip XML comments BEFORE matching. The manifest deliberately documents why the
            // type is specialUse and NOT dataSync, and why all-files access is absent and must
            // not return. That prose is the human guardrail against these same regressions, so a
            // substring search would fail the build on our own documentation.
            def stripped = text.replaceAll(/(?s)<!--.*?-->/, '')

            // V-1: compare the android:name attribute VALUE for equality against the banned set.
            def permMatcher = stripped =~ /(?s)<uses-permission\b[^>]*?android:name\s*=\s*"([^"]+)"/
            while (permMatcher.find()) {
                def declared = permMatcher.group(1)
                if (bannedPermissions.containsKey(declared)) {
                    failures << (declared + " is present in the merged manifest (" +
                            manifestFile.name + ")\n    " + bannedPermissions[declared])
                }
            }

            // V-2: split each foregroundServiceType attribute VALUE on '|' and compare
            // token-wise, so combined forms such as "dataSync|specialUse" are caught.
            stripped.split(/(?=<service\b)/).each { chunk ->
                def typeMatcher = chunk =~ /android:foregroundServiceType\s*=\s*"([^"]+)"/
                if (typeMatcher.find()) {
                    def value = typeMatcher.group(1)
                    def tokens = value.split(/\|/).collect { it.trim() }
                    if (tokens.contains('dataSync')) {
                        def nameMatcher = chunk =~ /android:name\s*=\s*"([^"]+)"/
                        def svc = nameMatcher.find() ? nameMatcher.group(1) : '(unnamed service)'
                        failures << ('<service android:name="' + svc + '"> declares ' +
                                'foregroundServiceType="' + value + '"\n    ' +
                                bannedPermissions['android.permission.FOREGROUND_SERVICE_DATA_SYNC'])
                    }
                }
            }
        }

        if (!failures.isEmpty()) {
            def variant = manifestTask.name.contains('Release') ? 'release' : 'debug'
            throw new GradleException(
                    "\n\nBuild blocked - banned manifest declaration present:\n" +
                    failures.unique().collect { "  * ${it}" }.join("\n") +
                    "\n\n  Origin: see app/build/outputs/logs/manifest-merger-" + variant + "-report.txt\n" +
                    "  (that report names the contributing library when it is not our own manifest)\n")
        }
    }
}

