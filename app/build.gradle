plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.hilt.android)
    alias(libs.plugins.ksp)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.google.services)
    id 'kotlin-parcelize'
}

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.safeguard.parentalcontrol'
    compileSdk 34

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.safeguard.parentalcontrol"
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName "1.1.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        // Backend configuration
        //buildConfigField "String", "API_BASE_URL", "\"https://api.safeguard.app/api/v1/\""
        //buildConfigField "String", "API_BASE_URL", "\"http://192.168.1.5:8090/api/v1/\""
        buildConfigField "String", "API_BASE_URL", "\"https://bw.noor.net:8090/api/v1/\""
        buildConfigField "String", "API_VERSION", "\"1.0\""

        // Google OAuth - Web Client ID (client_type 3) from google-services.json.
        // Must belong to the same Firebase project as google-services.json (814941014353 / haris-db7b0),
        // otherwise Google Sign-In fails with DEVELOPER_ERROR.
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"814941014353-8ccdjaes5thocovg3l6qu6rrmobknssh.apps.googleusercontent.com\""
    }

    buildTypes {
        release {
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : null
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // Production backend
            //buildConfigField "String", "API_BASE_URL", "\"https://api.safeguard.app/api/v1/\""
            //buildConfigField "String", "API_BASE_URL", "\"http://192.168.1.5:8090/api/v1/\""
            buildConfigField "String", "API_BASE_URL", "\"https://bw.noor.net:8090/api/v1/\""
        }
        debug {
            minifyEnabled false
            
            // Development backend
            // buildConfigField "String", "API_BASE_URL", "\"http://10.0.2.2:8000/api/v1/\""
            //buildConfigField "String", "API_BASE_URL", "\"http://192.168.1.5:8090/api/v1/\""
            buildConfigField "String", "API_BASE_URL", "\"https://bw.noor.net:8090/api/v1/\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            '-opt-in=kotlin.RequiresOptIn',
            '-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi',
            '-opt-in=androidx.compose.material3.ExperimentalMaterial3Api'
        ]
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    // Prevent TFLite models from being compressed
    aaptOptions {
        noCompress "tflite"
    }
}

hilt {
    enableAggregatingTask = true
}

